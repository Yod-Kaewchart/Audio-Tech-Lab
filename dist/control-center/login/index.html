<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Tech Labs - Control Center Login</title>
<style>
/* Typography and palette follow dist/styles.css and dist/home.css.
   Same-origin fonts keep the existing Control Center CSP intact. */
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url('/control-center/login/fonts/dm-sans.ttf') format('truetype')}
@font-face{font-family:"Noto Sans Thai";font-style:normal;font-weight:400 700;font-display:swap;src:url('/control-center/login/fonts/noto-sans-thai.ttf') format('truetype')}
:root{
  color-scheme:dark;
  --bg:#141719;--deep:#101214;--panel:#191c1f;--surface:#202427;
  --hover:#272c30;--line:#353b40;--control-border:#80898f;
  --text:#f0eee8;--muted:#b9bec2;--accent:#c9aa70;--accent-hover:#d8bc89;
  --ok:#8bceaa;--danger:#e68b8b;--shell:1240px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans","Noto Sans Thai",sans-serif;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
button,input{font:inherit}
button{transition:background-color 180ms,color 180ms,border-color 180ms}
:focus-visible{outline:2px solid var(--accent-hover);outline-offset:4px}
::selection{background:var(--accent);color:var(--deep)}
.brand{font-size:15px;font-weight:700;letter-spacing:.16em;line-height:1.6;color:#f2f0eb}
.brand span{color:#d0ad73;font-weight:500}
.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.23em;font-weight:700;line-height:1.8}
@media(prefers-reduced-motion:reduce){button{transition:none}}

body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:40px 24px}
.card{width:min(500px,100%);min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:40px}
.eyebrow{margin-top:36px}
.title{font-size:32px;font-weight:600;line-height:1.18;letter-spacing:-.045em;margin:12px 0 16px}
.lead{color:var(--muted);font-size:15px;line-height:1.8;margin:0 0 28px}
form{display:grid;gap:0}
label{display:block;color:var(--text);font-size:13px;font-weight:500;margin:20px 0 8px}
label:first-child{margin-top:0}
.field{width:100%;min-width:0;min-height:50px;border:1px solid var(--control-border);background:var(--panel);color:var(--text);border-radius:6px;padding:12px 14px;font-size:16px;line-height:1.5}
.field:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
button{width:100%;min-height:50px;margin-top:24px;border:1px solid var(--accent);background:var(--accent);color:var(--deep);border-radius:6px;padding:12px 16px;font-size:14px;line-height:1.6;font-weight:600;cursor:pointer}
button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button:disabled{opacity:.55;cursor:wait}
.message{min-height:22px;margin-top:16px;color:var(--muted);font-size:13px;line-height:1.7}
.message.error{color:var(--danger)}
.note{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}
[hidden]{display:none!important}
@media(max-width:560px){
  body{padding:24px 20px}.card{padding:28px 24px}
  .brand{font-size:13px}.eyebrow{margin-top:28px}
  .title{font-size:28px}.lead{font-size:14px;margin-bottom:24px}
}
</style>
</head>
<body>
<main class="card">
<div class="brand">AUDIO <span>TECH LABS</span></div>
<div class="eyebrow">CONTROL CENTER</div>
<h1 class="title">Administrator Sign In</h1>
<p class="lead">Use the existing Audio Tech Labs administrator account. Access is restricted to admin sessions only.</p>
<form id="login-form" autocomplete="on">
<label for="username">Username or email</label>
<input class="field" id="username" name="username" autocomplete="username" required>
<label for="password">Password</label>
<input class="field" id="password" name="password" type="password" autocomplete="current-password" required>
<button id="login-button" type="submit">Sign in</button>
</form>
<form id="password-form" hidden>
<label for="current-password">Current password</label>
<input class="field" id="current-password" type="password" autocomplete="current-password" required>
<label for="new-password">New password</label>
<input class="field" id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<label for="confirm-password">Confirm new password</label>
<input class="field" id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button id="password-button" type="submit">Change password and continue</button>
</form>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="note">Session cookie is HttpOnly and Secure. Control Center sessions expire according to the existing Audio Tech Labs authentication policy.</div>
</main>
<script>
'use strict';
const form=document.querySelector('#login-form'), passwordForm=document.querySelector('#password-form'), message=document.querySelector('#message');
const loginButton=document.querySelector('#login-button'), passwordButton=document.querySelector('#password-button');
let auth=null;
function clearLoginPage(){
  auth=null; form.hidden=false; passwordForm.hidden=true; form.reset(); passwordForm.reset();
  for(const id of ['username','password','current-password','new-password','confirm-password']){const input=document.getElementById(id);if(input){input.value='';input.setAttribute('autocomplete','off')}}
  setMessage('');
}
function setMessage(text,error=false){message.textContent=text||'';message.classList.toggle('error',!!error)}
async function api(path,options={}){
  const response=await fetch('/api'+path,{credentials:'same-origin',cache:'no-store',...options});
  const type=response.headers.get('content-type')||''; const data=type.includes('application/json')?await response.json():{};
  if(!response.ok)throw Object.assign(new Error(data.error||'Request failed'),{status:response.status});
  return data;
}
async function logout(csrf){
  try{await api('/auth/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:'{}'})}catch{}
}
async function continueIfAdmin(value){
  if(value?.user?.role!=='admin'){await logout(value?.csrf);setMessage('Administrator access required.',true);return false}
  if(value.user.mustChange){auth=value;form.hidden=true;passwordForm.hidden=false;setMessage('Change the temporary password before entering Control Center.');return false}
  location.replace('/control-center/'); return true;
}
form.addEventListener('submit',async event=>{
  event.preventDefault(); loginButton.disabled=true; setMessage('Signing in...');
  try{
    const username=document.querySelector('#username').value.trim().toLowerCase();
    const password=document.querySelector('#password').value;
    auth=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    document.querySelector('#password').value='';
    await continueIfAdmin(auth);
  }catch(error){
    setMessage(error.status===401?'Incorrect username/email or password.':error.status===429?'Too many attempts. Try again later.':error.status===502||error.status===504?'Control Center backend is offline.':error.message,true);
  }finally{loginButton.disabled=false}
});
passwordForm.addEventListener('submit',async event=>{
  event.preventDefault(); passwordButton.disabled=true; setMessage('Updating password...');
  try{
    const currentPassword=document.querySelector('#current-password').value;
    const newPassword=document.querySelector('#new-password').value;
    const confirm=document.querySelector('#confirm-password').value;
    if(newPassword!==confirm)throw new Error('New passwords do not match.');
    auth=await api('/auth/password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':auth.csrf},body:JSON.stringify({currentPassword,newPassword})});
    await continueIfAdmin(auth);
  }catch(error){setMessage(error.message,true)}finally{passwordButton.disabled=false}
});
const signedOut=new URLSearchParams(location.search).get('signedout')==='1';
if(signedOut){clearLoginPage();history.replaceState(null,'','/control-center/login/');}
window.addEventListener('pageshow',event=>{if(signedOut||event.persisted)clearLoginPage()});
(async()=>{
  try{const existing=await api('/auth/me');await continueIfAdmin(existing)}catch(error){if(error.status!==401&&error.status!==502&&error.status!==504)setMessage(error.message,true);else if(signedOut)clearLoginPage()}
})();
</script>
</body>
</html>
