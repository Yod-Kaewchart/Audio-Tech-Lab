name: Validate Cloudflare Pages build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages-validate"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test portable backend and Pages integration (audio core is verified on EliteBook)
        run: node tools/test-portable.cjs
      - name: Build Cloudflare Pages artifact
        run: node tools/build-pages.cjs
      - name: Verify patch cleanliness
        run: git diff --check
